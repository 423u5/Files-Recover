name: windows-build

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # msvc-fuzz: the libFuzzer targets (fuzz/), whose tests are a short
        # smoke run of each and the inputs that once failed (fuzz/regressions).
        preset: [msvc-debug, msvc-release, msvc-asan, msvc-fuzz]
    steps:
      - uses: actions/checkout@v6

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        id: test
        run: ctest --preset ${{ matrix.preset }} --output-junit "${{ github.workspace }}/build/${{ matrix.preset }}/ctest-junit.xml"

      # The job log needs admin rights to read; annotations and the step
      # summary do not. Every failed test becomes an annotation that says why.
      - name: Report failed tests
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        shell: pwsh
        run: >
          ./.github/scripts/report_failed_tests.ps1
          -Junit "${{ github.workspace }}/build/${{ matrix.preset }}/ctest-junit.xml"
          -Preset "${{ matrix.preset }}"

      - name: Keep the test logs
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: test-logs-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/ctest-junit.xml
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          retention-days: 14

  analyze:
    name: msvc-analyze
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: cmake --preset msvc-analyze
      # /WX makes every /analyze warning an error.
      - run: cmake --build --preset msvc-analyze
